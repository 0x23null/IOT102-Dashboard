<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>IOT102 - Cloud Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafb; }
        .font-headline { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="text-[#2c3436]">
<div class="flex min-h-screen">
    <aside class="w-72 bg-[#f0f4f6] flex flex-col justify-between p-8 border-r border-gray-200">
        <div class="flex flex-col gap-10">
            <div>
                <h1 class="text-[#466370] font-headline text-2xl font-extrabold">IOT102</h1>
                <p class="text-[#596063] text-[10px] uppercase font-bold tracking-widest">Air Monitoring System</p>
            </div>
            <div class="p-6 rounded-2xl bg-white border border-gray-200 shadow-sm">
                <p class="text-[#466370] font-bold text-xs mb-2">Sensor Health</p>
                <div class="flex items-center justify-between">
                    <span class="text-[10px] text-gray-400 uppercase font-bold" id="wifi-status">OFFLINE</span>
                    <span id="status-dot" class="flex h-2 w-2 rounded-full bg-gray-400"></span>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col p-12 gap-12">
        <header class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-[#466370]">location_on</span>
                <h2 class="font-headline text-xl font-bold">FPT University, VN</h2>
            </div>
        </header>

        <section class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
            <div class="lg:col-span-7 flex flex-col gap-4">
                <div class="px-4 py-1.5 rounded-full bg-[#abf4ac] text-[#185e27] w-fit text-[10px] font-bold uppercase tracking-widest">Firebase Realtime</div>
                <h3 class="font-headline text-5xl font-extrabold leading-tight">Your air is <span id="status-color" class="text-green-600">Waiting...</span>.</h3>
            </div>
            <div class="lg:col-span-5 flex justify-center">
                <div class="relative w-56 h-56 flex items-center justify-center">
                    <svg class="absolute inset-0 w-full h-full transform -rotate-90">
                        <circle class="text-gray-200" cx="112" cy="112" r="90" fill="transparent" stroke="currentColor" stroke-width="18"></circle>
                        <circle id="gauge-circle" class="text-green-500" cx="112" cy="112" r="90" fill="transparent" stroke="currentColor" stroke-width="18" stroke-dasharray="565.5" stroke-dashoffset="565.5" stroke-linecap="round" style="transition: stroke-dashoffset 1s ease-in-out;"></circle>
                    </svg>
                    <div class="flex flex-col items-center">
                        <span id="val-aqi" class="font-headline text-6xl font-black">0</span>
                        <span class="text-[10px] font-bold uppercase text-gray-400">AQI Index</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-[10px] font-black uppercase text-gray-400 mb-6">Temperature</p>
                <p class="text-3xl font-extrabold font-headline"><span id="val-temp">--</span>°C</p>
            </div>
            <div class="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-[10px] font-black uppercase text-gray-400 mb-6">Humidity</p>
                <p class="text-3xl font-extrabold font-headline"><span id="val-hum">--</span>%</p>
            </div>
            <div class="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-[10px] font-black uppercase text-gray-400 mb-6">PM2.5</p>
                <p class="text-3xl font-extrabold font-headline"><span id="val-pm">--</span> <span class="text-xs font-normal">ug/m3</span></p>
            </div>
            <div class="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-[10px] font-black uppercase text-gray-400 mb-6">Trend AI</p>
                <p class="text-xl font-extrabold font-headline text-blue-600" id="val-ai">Analyzing...</p>
            </div>
        </section>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    // Dán Config của Hải vào đây
    const firebaseConfig = {
        apiKey: "AIzaSyC3ak9wrcoxz0P45xMaoaSGbKW-abFz-Yc",
        authDomain: "iot102-airmonitor.firebaseapp.com",
        databaseURL: "https://iot102-airmonitor-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "iot102-airmonitor",
        storageBucket: "iot102-airmonitor.firebasestorage.app",
        messagingSenderId: "271083838027",
        appId: "1:271083838027:web:d9918d5b6e76ba665a0bce"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const sensorRef = ref(db, 'SensorData'); // ESP32 sẽ đẩy dữ liệu vào folder 'SensorData'

    // Lắng nghe dữ liệu thay đổi Realtime
    onValue(sensorRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            document.getElementById('val-temp').innerText = data.nhiet || "--";
            document.getElementById('val-hum').innerText = data.am || "--";
            document.getElementById('val-pm').innerText = data.bui || "--";
            document.getElementById('val-aqi').innerText = data.aqi || "0";
            document.getElementById('wifi-status').innerText = "CONNECTED";
            document.getElementById('status-dot').className = "flex h-2 w-2 rounded-full bg-green-500 animate-pulse";

            // Logic Gauge & Màu sắc
            const aqi = data.aqi || 0;
            const circle = document.getElementById('gauge-circle');
            const statusText = document.getElementById('status-color');
            const offset = 565.5 - (Math.min(aqi, 300) / 300) * 565.5;
            circle.style.strokeDashoffset = offset;

            if(aqi > 150) {
                circle.setAttribute('class', 'text-red-500');
                statusText.innerText = "Unhealthy"; statusText.className = "text-red-600";
            }
             else if(aqi > 50) {
                circle.setAttribute('class', 'text-yellow-500');
                statusText.innerText = "Normal"; statusText.className = "text-yellow-600";
            } else {
                circle.setAttribute('class', 'text-green-500');
                statusText.innerText = "Good"; statusText.className = "text-green-600";
            }
        }
    });
</script>
</body>
</html>
